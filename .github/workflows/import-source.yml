name: Import original script.bingie.toolbox sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract original add-on source and preserve credits
        env:
          ADDON_ID: script.bingie.toolbox
          UPSTREAM_VERSION: 1.0.0
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import urllib.request
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from zipfile import ZipFile

          addon = os.environ['ADDON_ID']
          version = os.environ['UPSTREAM_VERSION']
          filename = f'{addon}-{version}.zip'
          url = f'https://raw.githubusercontent.com/matke-84/repository.bingie/main/omega/{addon}/{filename}'
          if Path('addon.xml').exists():
              print('Existing sources detected: refusing to overwrite')
              raise SystemExit(0)
          with urllib.request.urlopen(url, timeout=120) as response:
              payload = response.read(20 * 1024 * 1024 + 1)
          if len(payload) > 20 * 1024 * 1024:
              raise ValueError('Unexpected archive size')
          size = 0
          with ZipFile(BytesIO(payload)) as z:
              for info in z.infolist():
                  parts = PurePosixPath(info.filename).parts
                  if parts == (addon,) and info.is_dir():
                      continue
                  if len(parts) < 2 or parts[0] != addon or any(part in ('.', '..') for part in parts):
                      raise ValueError('Unsafe archive path: ' + info.filename)
                  if stat.S_IFMT(info.external_attr >> 16) == stat.S_IFLNK:
                      raise ValueError('Symlink not supported: ' + info.filename)
                  size += info.file_size
                  if size > 80 * 1024 * 1024:
                      raise ValueError('Unexpected uncompressed archive size')
                  target = Path(*parts[1:])
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open('wb') as dest:
                          shutil.copyfileobj(src, dest)
          manifest = ET.parse('addon.xml').getroot()
          if manifest.get('id') != addon or manifest.get('version') != version:
              raise ValueError('Incorrect Kodi add-on in downloaded archive')
          Path('UPSTREAM-ORIGIN.txt').write_text(
              f'Upstream: {url}\n'
              f'Original version: {version}\n'
              f'SHA256 of upstream ZIP: {hashlib.sha256(payload).hexdigest()}\n'
              'Source files are included for independent editing. Preserve authorship and license notices.\n',
              encoding='utf-8'
          )
          print(f'Imported {addon} {version} source files')
          PY
      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Import original script.bingie.toolbox 1.0.0 sources"
            git push origin HEAD:main
          fi
